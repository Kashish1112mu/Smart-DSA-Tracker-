<!DOCTYPE html>
<html>
<head>
    <title>Add Problem</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;
        }

        .form-card {
            border-radius: 20px;
            background: white;
        }

        .btn-custom {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card form-card shadow p-4" style="width: 400px;">

        <h3 class="text-center mb-4">➕ Add New Problem</h3>

        <form method="POST">

            <!-- Problem Name -->
            <div class="mb-3">
                <label class="form-label">Problem Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter problem name" required>
            </div>

            <!-- Difficulty -->
            <div class="mb-3">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Solved">Solved</option>
                    <option value="Not Solved">Not Solved</option>
                </select>
            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-primary w-100 btn-custom">
                Add Problem
            </button>

            <a href="/" class="btn btn-secondary w-100 mt-2 btn-custom">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
