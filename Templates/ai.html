<!DOCTYPE html>
<html>
<head>
    <title>AI Coach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h2>🤖 DSA AI Coach</h2>

    <form method="POST">
        <input type="text" name="query" class="form-control" placeholder="Ask about DP, Graph, Array..." />
        <button class="btn btn-primary mt-3">Ask AI</button>
    </form>

    {% if response %}
    <div class="alert alert-info mt-4 text-dark">
        {{ response }}
    </div>
    {% endif %}

    <a href="/" class="btn btn-light mt-3">Back</a>

</div>

</body>
</html>
